# ============================================================
# sonar-project.properties  (IE3 - análisis estático)
# Documenta la configuración de SonarCloud para este proyecto.
#
# NOTA: el pipeline ejecuta el análisis con el plugin de Maven
# (sonar-maven-plugin), que toma estos valores desde pom.xml y desde
# los parámetros -D del workflow. Este archivo se mantiene idéntico
# para que el mismo análisis pueda lanzarse con sonar-scanner (CLI).
#
# projectKey y organization se definen como variables del repositorio
# (Settings > Secrets and variables > Actions > Variables):
#   SONAR_PROJECT_KEY, SONAR_ORGANIZATION
# El token va como SECRET: SONAR_TOKEN (nunca en este archivo).
# ============================================================
sonar.host.url=https://sonarcloud.io
sonar.projectName=Order Manager API
sonar.projectVersion=1.0.0

# Código fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.sourceEncoding=UTF-8

# Cobertura generada por JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# La clase main es trivial: no se exige cobertura sobre ella
sonar.coverage.exclusions=**/OrderManagerApplication.java

# Quality Gate bloqueante: el análisis espera el veredicto y falla si no se cumple
sonar.qualitygate.wait=true
