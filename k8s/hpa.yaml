# Escalado horizontal automático (requiere metrics-server en el clúster).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-manager
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # evita "flapping" al bajar réplicas
---
# Durante mantenimiento del clúster siempre queda al menos 1 pod vivo.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-manager
