# EJEMPLO. No forma parte del kustomization ni debe contener claves reales.
# Crear el Secret real directamente en el clúster:
#
#   kubectl create namespace order-manager
#   kubectl -n order-manager create secret generic order-manager-db \
#     --from-literal=DB_USER=order_user \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
#
# (equivalente declarativo, solo con fines didácticos)
apiVersion: v1
kind: Secret
metadata:
  name: order-manager-db
  namespace: order-manager
type: Opaque
stringData:
  DB_USER: order_user
  DB_PASSWORD: CAMBIAR-ESTA-CLAVE
