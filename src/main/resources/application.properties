# ============================================================
# Identidad
# ============================================================
spring.application.name=order-manager

# ============================================================
# Base de datos H2 en memoria (desarrollo y tests)
# ============================================================
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# API REST: evita consultas SQL durante la serialización de respuestas HTTP.
spring.jpa.open-in-view=false

# ============================================================
# Consola H2 (http://localhost:8098/h2-console)
# ============================================================
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ============================================================
# Servidor
# ============================================================
server.port=8098

# ============================================================
# Probes de salud (liveness / readiness) -> usados por Docker y Kubernetes
#   /actuator/health/liveness   /actuator/health/readiness
# ============================================================
management.endpoint.health.probes.enabled=true

# ============================================================
# Trazabilidad: /actuator/info expone versión y commit desplegado (IE4)
# APP_COMMIT_SHA la inyecta el pipeline al construir la imagen Docker.
# ============================================================
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.commit=${APP_COMMIT_SHA:local}
