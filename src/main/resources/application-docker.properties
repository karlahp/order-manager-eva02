# ============================================================
# application-docker.properties
# Activo SOLO con SPRING_PROFILES_ACTIVE=docker (Docker Compose / Kubernetes).
# Sobrescribe application.properties (que usa H2 en memoria).
#
# NINGUNA credencial va escrita aquí: se inyectan por variables de
# entorno (.env en Compose, Secret en Kubernetes).
# ============================================================

# ------------------------------------------------------------
# PostgreSQL. "db" es el nombre del servicio en docker-compose.yml
# (en Kubernetes, el ConfigMap define DB_HOST=postgres).
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:orderdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexiones acotado: controla el consumo de la BD al escalar réplicas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------
# JPA / Hibernate
# "update" es aceptable para esta evaluación. En producción real se
# usaría "validate" + migraciones con Flyway o Liquibase.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console deshabilitada (no aplica con PostgreSQL)
spring.h2.console.enabled=false

# ------------------------------------------------------------
# Actuator: solo health e info. En el perfil docker NO se muestran
# detalles del health (evita filtrar información interna).
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ------------------------------------------------------------
# Servidor HTTP
# ------------------------------------------------------------
server.port=8098
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
